name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Compile and Test
    runs-on: ubuntu-latest

    env:
      BIZCART_AUTH_JWT_SECRET: test-only-0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -q -DskipTests compile

      - name: Test
        run: ./mvnw -q test
