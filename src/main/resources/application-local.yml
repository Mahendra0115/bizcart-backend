server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      repositories:
        enabled: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bizcart_db}
    username: ${DB_USERNAME:bizcart_app}
    password: ${DB_PASSWORD:}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

bizcart:
  auth:
    jwt:
      secret: ${BIZCART_AUTH_JWT_SECRET:local-development-0123456789abcdef0123456789abcdef}
    token-hash:
      secret: ${BIZCART_AUTH_TOKEN_HASH_SECRET:local-token-hash-0123456789abcdef0123456789abcdef}
    refresh-cookie:
      secure: false
    notification:
      password-reset-provider: ${BIZCART_AUTH_PASSWORD_RESET_PROVIDER:no-op}
      password-reset-from: ${BIZCART_AUTH_PASSWORD_RESET_FROM:no-reply@bizcart.local}
      password-reset-url: ${BIZCART_AUTH_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
      verification-provider: ${BIZCART_AUTH_VERIFICATION_PROVIDER:no-op}
      verification-from: ${BIZCART_AUTH_VERIFICATION_FROM:no-reply@bizcart.local}
      verification-url: ${BIZCART_AUTH_VERIFICATION_URL:http://localhost:5173/verify-email}
