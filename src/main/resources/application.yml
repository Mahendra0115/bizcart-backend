spring:
  application:
    name: bizcart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

bizcart:
	admin:
		bootstrap:
			enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
			first-name: ${ADMIN_BOOTSTRAP_FIRST_NAME:System}
			last-name: ${ADMIN_BOOTSTRAP_LAST_NAME:Admin}
			username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
			email: ${ADMIN_BOOTSTRAP_EMAIL:}
			password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  address:
    max-active-addresses: ${ADDRESS_MAX_ACTIVE_ADDRESSES:20}
  auth:
    rate-limit:
      max-buckets: ${AUTH_RATE_LIMIT_MAX_BUCKETS:100000}
      cleanup-interval-ms: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL_MS:60000}
    cleanup:
      cron: ${AUTH_CLEANUP_CRON:0 0 3 * * *}
      inactive-token-retention-days: ${AUTH_INACTIVE_TOKEN_RETENTION_DAYS:7}
      login-attempt-retention-days: ${AUTH_LOGIN_ATTEMPT_RETENTION_DAYS:90}
    proxy:
      trusted-proxies: ${AUTH_TRUSTED_PROXIES:127.0.0.1,::1}
