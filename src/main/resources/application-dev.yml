server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

bizcart:
  auth:
    jwt:
      secret: ${BIZCART_AUTH_JWT_SECRET}
    token-hash:
      secret: ${BIZCART_AUTH_TOKEN_HASH_SECRET}
    refresh-cookie:
      secure: true
    notification:
      password-reset-provider: ${BIZCART_AUTH_PASSWORD_RESET_PROVIDER}
      password-reset-from: ${BIZCART_AUTH_PASSWORD_RESET_FROM}
      password-reset-url: ${BIZCART_AUTH_PASSWORD_RESET_URL}
      verification-provider: smtp
      verification-from: ${BIZCART_AUTH_VERIFICATION_FROM}
      verification-url: ${BIZCART_AUTH_VERIFICATION_URL}
